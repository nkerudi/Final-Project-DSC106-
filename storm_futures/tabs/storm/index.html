<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hurricane Timeline</title>

  <link rel="stylesheet" href="./storm.css" />

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script defer src="./storm.js"></script>
</head>

<body>
  <main class="page">
    <section id="chart-container">
      <svg id="chart"></svg>
    </section>

    <div class="storm-legend">
      <div class="legend-item">
        <div class="legend-swatch" style="border-top-color:#0891b2;border-top-style:solid"></div>
        Tropical storm force diameter
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="border-top-color:#e11d48;border-top-style:solid"></div>
        Hurricane force diameter
      </div>
    </div>

    <div id="tooltip"></div>
  </main>
  <script>
    const _sendH = () => window.parent.postMessage(
      { type: 'iframeResize', height: document.documentElement.scrollHeight }, '*'
    );
    new ResizeObserver(_sendH).observe(document.documentElement);
    window.addEventListener('load', _sendH);
  </script>
</body>
</html>
