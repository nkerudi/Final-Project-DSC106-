<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurricane Timeline</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>

  <header>
    <h1>Atlantic Hurricane <span>Timeline</span></h1>
    <p class="subtitle">2005 – 2024 · peak intensity per storm · hover for details</p>
  </header>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot ts"></div> Tropical storm force diameter (avg, nmi)</div>
    <div class="legend-item"><div class="legend-dot hur"></div> Hurricane force diameter (avg, nmi)</div>
  </div>

  <div id="chart-container">
    <svg id="chart"></svg>
  </div>

  <div id="tooltip"></div>

  <script src="./storm.js"></script>
</body>
</html>
